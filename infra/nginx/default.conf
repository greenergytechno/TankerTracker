server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Land on the manager console.
  location = / {
    return 302 /tms-app.html;
  }

  # Static frontend files only. The API is a separate origin (:3000); when the
  # clients are repointed at it, add a proxy here or serve them same-origin.
  location / {
    try_files $uri =404;
    add_header Cache-Control "no-store";
  }
}
