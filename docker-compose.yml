# TankerTrack — full local stack.
#
#   cp .env.example .env      # then edit secrets
#   docker compose up --build
#
# Brings up four services:
#   db     — PostgreSQL 16 + PostGIS   (:5432)
#   minio  — S3-compatible bill store  (:9000 api, :9001 console)
#   api    — NestJS API, migrates on start (:3000)  -> http://localhost:3000/api/v1
#   web    — static manager site + driver app (:8080)
#
# NOTE: the HTML clients still use their in-browser store (store.js/localStorage)
# until they are repointed at the API — see docs/LOCAL-DEPLOYMENT.md. This compose
# deploys every piece and runs the real DB migrations; wiring the clients to the
# API is the remaining Phase 2 task.
name: tankertrack

services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tankertrack_dev}
      POSTGRES_DB: tankertrack
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tankertrack"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-tankertrack}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-tankertrack_dev_secret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  # One-shot: waits for MinIO, creates the private bills bucket, then exits.
  createbuckets:
    image: minio/mc
    depends_on:
      - minio
    environment:
      MC_USER: ${S3_ACCESS_KEY_ID:-tankertrack}
      MC_PASS: ${S3_SECRET_ACCESS_KEY:-tankertrack_dev_secret}
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 $$MC_USER $$MC_PASS; do echo 'waiting for minio'; sleep 2; done;
      mc mb -p local/tankertrack-bills;
      mc anonymous set none local/tankertrack-bills;
      echo 'bucket ready'; exit 0;"

  api:
    build: ./apps/api
    depends_on:
      db:
        condition: service_healthy
      createbuckets:
        condition: service_completed_successfully
    environment:
      NODE_ENV: development
      PORT: 3000
      # Local only: the API connects as the superuser so migrations can create
      # extensions/roles. Production must use the least-privilege tankertrack_app
      # role with its own password (see docs/LOCAL-DEPLOYMENT.md § Hardening).
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-tankertrack_dev}@db:5432/tankertrack
      DATABASE_SSL: disable
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_TTL: 15m
      JWT_REFRESH_TTL: 30d
      S3_ENDPOINT: http://minio:9000
      S3_REGION: ap-south-1
      S3_BUCKET: tankertrack-bills
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-tankertrack}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-tankertrack_dev_secret}
      S3_FORCE_PATH_STYLE: "true"
    ports:
      - "3000:3000"

  web:
    image: nginx:alpine
    depends_on:
      - api
    ports:
      - "8080:80"
    volumes:
      # Only the frontend files are mounted — never apps/api or .env.
      - ./tms-app.html:/usr/share/nginx/html/tms-app.html:ro
      - ./driver.html:/usr/share/nginx/html/driver.html:ro
      - ./store.js:/usr/share/nginx/html/store.js:ro
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  db-data:
  minio-data:
